<!DOCTYPE html>
<html>
    <head>
        <style>
          .box1::after{
            content: "✨";
            color: aquamarine;
          }
          p::before{
            content: "✨";
          }
          .box2::first-letter{
            font-size: 50px;
            color: aqua;
          }
        </style>
    </head>
    <body>
        <div class="box1">box1</div>
        <div class="box2">box2</div>
        <div class="box3">box3</div>
        <p>i am h</p>
        <p>i am i</p>
        <p>i am c</p>
    </body>
</html>
