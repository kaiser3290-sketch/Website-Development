<!DOCTYPE html>
<html>
    <body>
        <script>
            var fruits=["kiwi","apple","banana","mango"];
            fruits.reverse();
            document.write(fruits)
            fruits.sort();
            document.write(fruits);
            document.write("<br>")
            var num=[1,2,2,56,7];
            //sorting in descending order
            num.sort(
                function(a,b){
                    return b-a;
                }
            );
            document.write(num);
            document.write("<br>")    
            num.reverse();
            document.write(num);
            var a=[1,2,3,4,5];
            //map
            //2,4,6,8,10
            var newa=a.map(n=>n*2);
            document.write("<br>")
            document.write(newa);
            var newb=a.map(m=>m*3);
            document.write("<br>")
            document.write(newb);
            //evaluate
            document.write("<br>")
            var s=eval("5+3*7");
            document.write(s);
        </script>
    </body>
</html>
