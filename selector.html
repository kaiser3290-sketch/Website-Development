<!DOCTYPE html>
<html>
    <head>
        <title>selectors</title>
        <style>
            p{
                background-color: blue;
            }
            .demo{
                background-color: aquamarine;
            }
            #heading{
                background-color: beige;
            }
        </style>

    </head>
    <body>
        <h1 class="demo"> I am class selector</h1>
        <h1 id="heading">i am id selector</h1>
        <p>i am element selector</p>
    </body>
</html>
