<!DOCTYPE html>
<html>
    <body>
        <script>
            var time=new Date().getHours();
            document.write(time);
            if(time<12){
                document.write("Good Morning");
            }
            else if(time<19){
                document.write("Good Aternoon");
            }
            else{
                document.write("Good Evening")
            }
        </script>
    </body>
</html>
