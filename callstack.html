<!DOCTYPE html>
<html>
    <head></head>
    <body>
        <script>
            function add(n1,n2){
                return n1+n2;
            }
            function avg(n1,n2){
                var sum=add(n1,n2);
                // average=sum/total number
                return sum/2;
            }
            document.write(avg(5,6));
        </script>
    </body>
</html>
