<!DOCTYPE html>
<html>
    <head>
        <title>Calculator</title>
    </head>
    <body>
        <form action="/action_page.php" oninput="ans.value=parseInt(n1.value)*parseInt(n2.value)">
            <fieldset>
                <legend>Calculator</legend>
                <label>Enter number 1</label>
                <input type="number" id="n1" name="n1">
                <label>Enter number 2</label>
                <input type="number" id="n2" name="n2">
                <output name="ans" for="n1 n2"></output>
            </fieldset>
        </form>
    </body>
</html>
